[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "motion-research"
version = "0.1.0"
description = "Panda contact-control research with MuJoCo"
requires-python = ">=3.12,<3.13"
dependencies = ["mujoco==3.3.7", "numpy==2.2.6"]

[dependency-groups]
dev = ["pytest==8.4.2"]

[project.scripts]
motion = "motion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
